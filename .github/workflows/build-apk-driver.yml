name: Build Android APK
on:
  workflow_dispatch:   # run it by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses (the Android tools are already on this machine)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Add an APK build profile (keeps your other profiles untouched)
        run: |
          node -e "
          const fs=require('fs');
          const j=fs.existsSync('eas.json')?JSON.parse(fs.readFileSync('eas.json','utf8')):{};
          j.build=j.build||{};
          const p={distribution:'internal',android:{buildType:'apk'}};
          if(j.build.production) p.extends='production';
          j.build['apk-ci']=p;
          fs.writeFileSync('eas.json',JSON.stringify(j,null,2));
          console.log(JSON.stringify(j.build['apk-ci']));"
      - name: Build the APK on this machine (not on Expo's servers)
        run: eas build --platform android --profile apk-ci --local --non-interactive --output ${{ github.workspace }}/mr-burger-driver.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mr-burger-driver-apk
          path: mr-burger-driver.apk
          retention-days: 14
